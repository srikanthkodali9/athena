apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations-api
  namespace: personalization
  annotations:
    athena.fixture/version: after
    athena.fixture/diff-evidence-id: diff_recommendations_pool_002
spec:
  replicas: 4
  selector:
    matchLabels:
      app: recommendations-api
  template:
    metadata:
      labels:
        app: recommendations-api
    spec:
      containers:
        - name: recommendations-api
          image: example.invalid/recommendations-api:2026.07.18.2
          env:
            - name: REDIS_HOST
              value: redis-features.personalization.svc
            - name: REDIS_POOL_MAX_SIZE
              value: "140"
            - name: REDIS_POOL_ACQUIRE_TIMEOUT_MS
              value: "200"
